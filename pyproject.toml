[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gemma-decision-kit"
version = "0.6.1"
description = "Eider typed decisions with optimized NVFP4 Gemma and local multimodal inputs"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "gemma-decision-kit contributors"}]
[project.scripts]
gemma-decision = "gemma_decision.cli:main"
[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]

[project.optional-dependencies]
test = ["opencv-python-headless==4.13.0.92", "pillow==12.1.1"]
audio = ["transformers==5.8.1", "accelerate==1.14.0", "soundfile==0.13.1", "librosa==0.11.0"]

[tool.setuptools.package-data]
"gemma_decision.audio" = ["model.json"]
