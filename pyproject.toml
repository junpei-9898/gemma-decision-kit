[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gemma-decision-kit"
version = "0.2.0"
description = "NVFP4 Gemma three-choice decisions for text, images and short video"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "gemma-decision-kit contributors"}]
[project.scripts]
gemma-decision = "gemma_decision.cli:main"
[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
