[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gemma-decision-kit"
version = "0.1.0"
description = "Text-only, three-choice Gemma decision inference with speed/memory profiles"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "gemma-decision-kit contributors"}]
[project.scripts]
gemma-decision = "gemma_decision.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemma_decision = ["exl_manifest.json"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
