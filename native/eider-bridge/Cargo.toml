[package]
name = "eider-decision-bridge"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[workspace]
members = ["vendor/eider-format", "vendor/eider-runtime"]
[workspace.package]
version = "0.1.0"
edition = "2024"
[workspace.dependencies]
eider-format = { path = "vendor/eider-format" }
serde_json = { version = "1", features = ["float_roundtrip"] }
[dependencies]
eider-runtime = { path = "vendor/eider-runtime" }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
