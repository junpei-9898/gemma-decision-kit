<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="型付き判定の3種類。数値は架空の説明例"><title>型付き判定の3種類。数値は架空の説明例</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708399"/></marker></defs><style>text{font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#17253b}.label{font-size:21px;font-weight:650}.detail{font-size:17px;fill:#52637a}.note{font-size:18px;fill:#52637a}</style><rect x="0" y="0" width="1000" height="350" rx="20" fill="#f7f9fc"/>
<g data-box="true"><rect x="25" y="30" width="300" height="225" rx="13" fill="#eaf1fc" stroke="#cad3df" stroke-width="1.5" />
<text class="label" x="175.0" y="61" text-anchor="middle">noul：真偽</text>
<text class="detail" x="175.0" y="89" text-anchor="middle">急ぎの依頼か？</text>
<text class="detail" x="175.0" y="137" text-anchor="middle">true の確率：0.80</text>
<text class="detail" x="175.0" y="185" text-anchor="middle">単なる真偽値とは違う</text>
</g>
<g data-box="true"><rect x="350" y="30" width="300" height="225" rx="13" fill="#e6f4ef" stroke="#cad3df" stroke-width="1.5" />
<text class="label" x="500.0" y="61" text-anchor="middle">choice：選択</text>
<text class="detail" x="500.0" y="89" text-anchor="middle">担当部署は？</text>
<text class="detail" x="500.0" y="137" text-anchor="middle">物流 0.70／請求 0.20</text>
<text class="detail" x="500.0" y="161" text-anchor="middle">技術 0.10</text>
<text class="detail" x="500.0" y="185" text-anchor="middle">選択結果 ＋ 確率分布</text>
</g>
<g data-box="true"><rect x="675" y="30" width="300" height="225" rx="13" fill="#fff1df" stroke="#cad3df" stroke-width="1.5" />
<text class="label" x="825.0" y="61" text-anchor="middle">score：順序付き段階</text>
<text class="detail" x="825.0" y="89" text-anchor="middle">不満の強さは？</text>
<text class="detail" x="825.0" y="137" text-anchor="middle">段階0・1・2 の期待値</text>
<text class="detail" x="825.0" y="161" text-anchor="middle">例：1.10</text>
<text class="detail" x="825.0" y="185" text-anchor="middle">整数でなくてもよい</text>
</g>
<text class="note" x="500" y="302" text-anchor="middle">いずれも説明用の架空の値。候補の確率は、そのまま正答率ではない。</text>
</svg>