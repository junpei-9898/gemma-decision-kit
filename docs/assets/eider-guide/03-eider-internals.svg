<path d="M745 118 L745 170" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M455 230 L540 230" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M745 285 L745 350" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M255 355 L255 290" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/>
