<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Eider内部の役割分担。依存関係の完全な図ではなく概念図"><title>Eider内部の役割分担。依存関係の完全な図ではなく概念図</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708399"/></marker></defs><style>text{font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#17253b}.label{font-size:21px;font-weight:650}.detail{font-size:17px;fill:#52637a}.note{font-size:18px;fill:#52637a}</style><rect x="0" y="0" width="1000" height="520" rx="20" fill="#f7f9fc"/>
<g data-box="true"><rect x="55" y="40" width="890" height="78" rx="13" fill="#eaf1fc" stroke="#cad3df" stroke-width="1.5" />
<text class="label" x="500.0" y="71" text-anchor="middle">API：受付と結果の返却</text>
<text class="detail" x="500.0" y="99" text-anchor="middle">外から来たリクエストを検証する</text>
</g>
<g data-box="true"><rect x="55" y="175" width="400" height="110" rx="13" fill="#eeeafb" stroke="#cad3df" stroke-width="1.5" />
<text class="label" x="255.0" y="206" text-anchor="middle">Runtime：共通の処理・方針</text>
<text class="detail" x="255.0" y="234" text-anchor="middle">質問をモデル用に整える</text>
<text class="detail" x="255.0" y="258" text-anchor="middle">出力やキャッシュの扱いを決める</text>
</g>
<g data-box="true"><rect x="545" y="175" width="400" height="110" rx="13" fill="#e6f4ef" stroke="#cad3df" stroke-width="1.5" />
<text class="label" x="745.0" y="206" text-anchor="middle">Inference：モデルの実行</text>
<text class="detail" x="745.0" y="234" text-anchor="middle">Gemmaなどの計算を進める</text>
<text class="detail" x="745.0" y="258" text-anchor="middle">モデルごとの実行状態を持つ</text>
</g>
<g data-box="true"><rect x="55" y="355" width="400" height="104" rx="13" fill="#fff1df" stroke="#cad3df" stroke-width="1.5" />
<text class="label" x="255.0" y="386" text-anchor="middle">Format：ファイルを読む</text>
<text class="detail" x="255.0" y="414" text-anchor="middle">重みの形式・数値の配置を扱う</text>
</g>
<g data-box="true"><rect x="545" y="355" width="400" height="104" rx="13" fill="#ffffff" stroke="#cad3df" stroke-width="1.5" />
<text class="label" x="745.0" y="386" text-anchor="middle">CUDA：GPUを使う</text>
<text class="detail" x="745.0" y="414" text-anchor="middle">GPUメモリと計算処理を扱う</text>
</g>
