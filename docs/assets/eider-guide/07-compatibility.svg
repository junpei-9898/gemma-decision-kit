<text class="detail" x="500.0" y="94" text-anchor="middle">例：NVFP4／EXL3</text>
<text class="detail" x="500.0" y="118" text-anchor="middle">数値を保存・解釈する形式</text>
<text class="detail" x="500.0" y="142" text-anchor="middle">対応する読み込み処理が必要</text>
</g>
<g data-box="true"><rect x="675" y="35" width="300" height="150" rx="13" fill="#e6f4ef" stroke="#cad3df" stroke-width="1.5" />
