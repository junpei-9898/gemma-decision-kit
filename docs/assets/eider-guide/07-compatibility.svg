<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" role="img" aria-label="実行にはモデル構造・重み形式・GPU計算の対応が必要"><title>実行にはモデル構造・重み形式・GPU計算の対応が必要</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708399"/></marker></defs><style>text{font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#17253b}.label{font-size:21px;font-weight:650}.detail{font-size:17px;fill:#52637a}.note{font-size:18px;fill:#52637a}</style><rect x="0" y="0" width="1000" height="355" rx="20" fill="#f7f9fc"/>
<g data-box="true"><rect x="25" y="35" width="300" height="150" rx="13" fill="#eaf1fc" stroke="#cad3df" stroke-width="1.5" />
