name: CPU contract tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare verified audio test tools without root
        run: |
          mkdir -p "$RUNNER_TEMP/audio-tools"
          cd "$RUNNER_TEMP/audio-tools"
          curl --fail --location --retry 2 -o ffmpeg.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz
          curl --fail --location --retry 2 -o ffprobe.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64.gz
          echo 'bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz' | sha256sum --check
          echo '25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe.gz' | sha256sum --check
          gzip -dc ffmpeg.gz > ffmpeg
          gzip -dc ffprobe.gz > ffprobe
          chmod u+x ffmpeg ffprobe
          echo "$RUNNER_TEMP/audio-tools" >> "$GITHUB_PATH"
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: gemma-decision validate --input examples/request.json
